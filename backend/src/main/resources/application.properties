spring.application.name=masgym-api
# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masgym}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto del servidor
server.port=8080

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nahueltnf@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Seguridad / JWT
# JWT_SECRET es obligatoria (sin default): la app no arranca si no esta seteada.
# Tiene que tener al menos 32 caracteres (HS256). Generala una sola vez y no la cambies,
# o vas a invalidar todos los tokens/sesiones activas.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Usuario ADMIN inicial (solo se usa si todavia no existe ningun ADMIN en la base)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}