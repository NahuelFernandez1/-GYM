spring.application.name=masgym-api
# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masgym}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto del servidor. Render (y la mayoria de los hosts) asignan el puerto
# dinamicamente via la variable de entorno PORT; 8080 queda solo para local.
server.port=${PORT:8080}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nahueltnf@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Seguridad / JWT
# JWT_SECRET es obligatoria (sin default): la app no arranca si no esta seteada.
# Tiene que tener al menos 32 caracteres (HS256). Generala una sola vez y no la cambies,
# o vas a invalidar todos los tokens/sesiones activas.
security.jwt.secret=${JWT_SECRET}
# 30 dias por defecto, para no tener que loguearse seguido.
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Usuario ADMIN inicial (solo se usa si todavia no existe ningun ADMIN en la base)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}

# CORS: coma-separada. Default "*" (abierto) para no romper nada local/hoy.
# En produccion, setear CORS_ALLOWED_ORIGINS al dominio real del frontend
# (ej: https://masgym.com,https://www.masgym.com) para restringirlo.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# A donde se manda el mail cuando pasa un error real (500 del backend, o un
# error de JS sin capturar reportado por el frontend). Tiene cooldown de 10
# minutos por error repetido para no inundar la bandeja de entrada.
app.alert.email=${ALERT_EMAIL:nahueltnf@gmail.com}